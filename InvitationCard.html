<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Card</title>
    <link rel="stylesheet" href="style.css">
    
    <meta name="description"  content="You are invited to celebrate Hemant's birthday on 24 May in Cantt, Meerut. ">
</head>
<body>
    <main class="invitation">
        <div class="top-label">YOU'RE INVITED</div>
        <div class="cake">🎂</div>
        <p class="intro">LET'S CELEBRATE</p>
        <h1>Happy Birthday</h1>
        <h2>Hemant</h2>
        <div class="event-details">
            <div class="detail">
                <span class="icon">📆</span>
                <div>
                    <h3>DATE</h3>
                    <p>24 May</p>
                </div>
            </div>

            <div class="detail">
                <span class="icon">🕔</span>
                <div>
                    <h3>TIME</h3>
                    <p>5:00 PM onwards</p>
                </div>
            </div>

            <div class="details">
                <span class="icon">📍</span>
                <div>
                    <h3>VENUE</h3>
                    <p>Cantt, Meerut</p>
                </div>
            </div>

        </div>
        <p class="closing">
            Your presence will make the day special!
        </p>

        <p class="rsvp">
            RSVP: Mayank Gautam
        </p>
        <footer>MADE WITH ❤️ FOR A SPECIAL DAY</footer>


    </main>


    
</body>
</html>
